name: Build, Test, Deploy

# Phase 9 — runs from every push, so CI protects Phase 4/5/6... work too.
# The "deploy" job only fires on main, and only once GCP_SA_KEY / GCP_PROJECT_ID
# repo secrets exist (see docs/deployment/README.md for how to create them).

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  # Change these if you rename either Cloud Run service — kept in one place
  # so the deploy steps and health-check steps agree.
  CLOUD_RUN_SERVICE: ai-carryon-gateway
  CLOUD_RUN_WORKER_SERVICE: ai-carryon-worker
  CLOUD_RUN_REGION: asia-south1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Phase 3 rate-limit test (self-mocked, CI-safe)
        run: python tests/phase3_redis_ratelimit_test.py

      - name: Phase 1 Firebase test (skipped in CI)
        run: |
          echo "tests/phase1_firebase_test.py needs a real Firebase project +"
          echo "service account (creates/deletes a live user) — it's meant to"
          echo "be run manually, locally, against real credentials, not in CI."
          echo "Run it yourself with: python tests/phase1_firebase_test.py"

  build:
    needs: test
    runs-on: ubuntu-latest
    # Only build/push images from main, not from PRs.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Requires two repo secrets, created once per docs/deployment/README.md:
      #   GCP_SA_KEY       — JSON key for a service account with the
      #                      Cloud Run Admin + Service Account User roles
      #   GCP_PROJECT_ID   — the target GCP project
      # All other runtime config (Firebase, Upstash, Qdrant, LLM keys, etc.)
      # lives in Secret Manager and is wired in via --set-secrets below, NOT
      # passed as plain --set-env-vars — see the runbook for the mapping.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Not every var in the "full" secret list necessarily has a real
      # Secret Manager entry yet (e.g. ELEVENLABS_API_KEY before that
      # integration has real credentials) — setup_secrets.sh intentionally
      # skips creating a secret for anything empty in .env, per its own
      # output ("skip VAR (empty or not set)"). Passing a --set-secrets
      # entry that names a secret which doesn't exist fails the WHOLE
      # deploy (gcloud.run.deploy: "Secret ... was not found"), even
      # though most of the list is fine. So: build the secrets list here
      # from what's ACTUALLY in Secret Manager right now, not from a
      # static assumption that all 14 exist. A var missing from Secret
      # Manager just means that env var won't be set in the container —
      # exactly like today, nothing regresses, it just stops blocking the
      # whole deploy over integrations that aren't wired up yet.
      - name: Compute available secrets
        id: compute_secrets
        run: |
          CANDIDATES="FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_STORAGE_BUCKET UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN QDRANT_URL QDRANT_API_KEY CHANNEL_SECRETS_ENCRYPTION_KEY GEMINI_API_KEY GROQ_API_KEY OPENAI_API_KEY YOUTUBE_CLIENT_SECRETS_B64 YOUTUBE_TOKEN_B64 ELEVENLABS_API_KEY CELERY_BROKER_URL INTERNAL_SCHEDULER_TOKEN SERPER_API_KEY PEXELS_API_KEY YOUTUBE_OAUTH_REDIRECT_URI FRONTEND_URL"
          {
            echo "secrets_list<<SECRETS_EOF"
            for VAR in $CANDIDATES; do
              if gcloud secrets describe "$VAR" --project "${{ secrets.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
                echo "${VAR}=${VAR}:latest"
              else
                echo "  (skipping $VAR — no Secret Manager entry yet)" >&2
              fi
            done
            echo "SECRETS_EOF"
          } >> "$GITHUB_OUTPUT"

      # --- API/gateway: request-driven, scales to zero when idle ---
      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.CLOUD_RUN_REGION }}
          flags: --allow-unauthenticated --port=8080
          env_vars: FIREBASE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          secrets: ${{ steps.compute_secrets.outputs.secrets_list }}

      # --- Worker: Celery needs to run continuously, which Cloud Run isn't
      # built for by default. --no-cpu-throttling + --min-instances=1 keeps
      # exactly one instance always running (billed continuously — this is
      # the trade-off vs. a small always-on VM). The container's actual
      # entrypoint here is worker_entrypoint.py, NOT the plain celery
      # command — see that file's docstring for why: Cloud Run needs
      # something answering on $PORT to consider the instance healthy,
      # which a bare Celery process never does on its own. ---
      - name: Deploy worker to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_WORKER_SERVICE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.CLOUD_RUN_REGION }}
          flags: >-
            --no-allow-unauthenticated
            --no-cpu-throttling
            --min-instances=1
            --max-instances=1
            --memory=8Gi
            --cpu=2
            --port=8080
            --command=python,-m
            --args=app.workers.worker_entrypoint
          env_vars: FIREBASE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          secrets: ${{ steps.compute_secrets.outputs.secrets_list }}

      # --- Railway option (kept for reference; not the chosen path) ---
      # - uses: bervProject/railway-deploy@main
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: ai-carryon-gateway

      - name: Verify API /health
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.CLOUD_RUN_REGION }} --format='value(status.url)')
          echo "Checking $URL/health"
          curl -sf "$URL/health" || (echo "API health check failed" && exit 1)

      - name: Verify worker is running (Cloud Run revision status only)
        run: |
          gcloud run services describe ${{ env.CLOUD_RUN_WORKER_SERVICE }} \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --format='value(status.conditions[0].status)' | grep -q True \
            || (echo "Worker service not in a healthy state" && exit 1)

  # --- Per-channel workers: channels with their own celery_broker_url
  # (set via the Providers UI, stored in Firestore per Ch.12d — see
  # celery_broker_url_override in ai/models/provider_key_context.py)
  # need their OWN listening worker, not just the enqueue-side routing
  # graph.py already does. The shared `deploy` job's ai-carryon-worker
  # above only ever consumes from the platform-wide CELERY_BROKER_URL
  # secret — a channel isn't actually isolated until a worker like this
  # one exists for it too. Add one matrix entry per such channel; the
  # broker_secret value here is a DEPLOY-TIME Secret Manager entry,
  # deliberately separate from the Firestore value the gateway reads —
  # both must be kept in sync by hand when a channel's broker URL is
  # rotated (see docs/deployment/README.md for the rotation runbook,
  # once one exists).
  deploy_channel_workers:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        channel:
          - slug: ai_carryon_stories_5e835f29
            service: ai-carryon-worker-stories
            broker_secret: CELERY_BROKER_URL__AI_CARRYON_STORIES_5E835F29
    steps:
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Same shape as the shared worker's compute_secrets step, except
      # CELERY_BROKER_URL is swapped for THIS channel's own broker
      # secret instead of the platform-wide one. If that per-channel
      # secret doesn't exist yet, this FAILS LOUDLY rather than
      # silently falling back to a shared broker — a channel worker
      # must never silently share a broker, or this whole isolation
      # effort is defeated invisibly.
      - name: Compute available secrets for this channel
        id: compute_secrets
        run: |
          CANDIDATES="FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_STORAGE_BUCKET UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN QDRANT_URL QDRANT_API_KEY CHANNEL_SECRETS_ENCRYPTION_KEY GEMINI_API_KEY GROQ_API_KEY OPENAI_API_KEY YOUTUBE_CLIENT_SECRETS_B64 YOUTUBE_TOKEN_B64 ELEVENLABS_API_KEY INTERNAL_SCHEDULER_TOKEN SERPER_API_KEY PEXELS_API_KEY YOUTUBE_OAUTH_REDIRECT_URI FRONTEND_URL"
          {
            echo "secrets_list<<SECRETS_EOF"
            for VAR in $CANDIDATES; do
              if gcloud secrets describe "$VAR" --project "${{ secrets.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
                echo "${VAR}=${VAR}:latest"
              else
                echo "  (skipping $VAR — no Secret Manager entry yet)" >&2
              fi
            done
            if gcloud secrets describe "${{ matrix.channel.broker_secret }}" --project "${{ secrets.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
              echo "CELERY_BROKER_URL=${{ matrix.channel.broker_secret }}:latest"
            else
              echo "::error::Secret ${{ matrix.channel.broker_secret }} not found — create it before this channel's worker can deploy with its own isolated broker."
              exit 1
            fi
            echo "SECRETS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy ${{ matrix.channel.service }} to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ matrix.channel.service }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.CLOUD_RUN_REGION }}
          flags: >-
            --no-allow-unauthenticated
            --no-cpu-throttling
            --min-instances=1
            --max-instances=1
            --memory=8Gi
            --cpu=2
            --port=8080
            --command=python,-m
            --args=app.workers.worker_entrypoint
          env_vars: FIREBASE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          secrets: ${{ steps.compute_secrets.outputs.secrets_list }}

      - name: Verify ${{ matrix.channel.service }} is running
        run: |
          gcloud run services describe ${{ matrix.channel.service }} \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --format='value(status.conditions[0].status)' | grep -q True \
            || (echo "${{ matrix.channel.service }} not in a healthy state" && exit 1)

  # --- Frontend: Firebase Hosting, kept separate from the backend
  # `deploy` job above on purpose — different toolchain (npm build, not
  # a Docker image), different target (Firebase Hosting, not Cloud
  # Run), and no reason a frontend deploy should wait on a backend one
  # or vice versa. Before this job can succeed, one-time setup is
  # needed — see docs/deployment/README.md's "Frontend CI deploy"
  # section:
  #   1. Grant the same service account GCP_SA_KEY already holds the
  #      Firebase Hosting Admin role (it only has Cloud Run Admin +
  #      Service Account User today):
  #        gcloud projects add-iam-policy-binding <project-id> \
  #          --member="serviceAccount:<sa-email>" \
  #          --role="roles/firebasehosting.admin"
  #   2. Add six repo secrets with the values from your own
  #      frontend/.env.local (gitignored — never committed, unlike
  #      frontend/.env.production.local which already holds
  #      NEXT_PUBLIC_API_BASE_URL and needs no new secret):
  #        gh secret set NEXT_PUBLIC_FIREBASE_API_KEY --body "..."
  #        gh secret set NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN --body "..."
  #        gh secret set NEXT_PUBLIC_FIREBASE_PROJECT_ID --body "..."
  #        gh secret set NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET --body "..."
  #        gh secret set NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID --body "..."
  #        gh secret set NEXT_PUBLIC_FIREBASE_APP_ID --body "..."
  deploy_frontend:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # NEXT_PUBLIC_API_BASE_URL isn't set here — Next.js auto-loads it
      # from the already-committed frontend/.env.production.local
      # during a production build, same as it would locally.
      - name: Build static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build

      # firebase.json (repo root) already points "public" at
      # frontend/out, which `output: 'export'` in next.config.js just
      # produced — nothing extra to configure here.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          channelId: live
